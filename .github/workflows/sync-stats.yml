name: 🔄 Sync Live DSA & CP Stats

on:
  schedule:
    # Run automatically every 6 hours
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'assets/**'
      - '.github/**'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🚀 Fetch Real-Time Coding Stats & Update Dashboard
        run: |
          python3 scripts/sync_stats.py

      - name: 💾 Commit & Push Changes
        env:
          PAT_TOKEN: ${{ secrets.PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GIT_NAME: ${{ vars.GIT_NAME || 'AdityaPatra-dev' }}
          GIT_EMAIL: ${{ vars.GIT_EMAIL || 'adityapatraraj@gmail.com' }}
        run: |
          git config --global user.name "$GIT_NAME"
          git config --global user.email "$GIT_EMAIL"
          export GIT_AUTHOR_NAME="$GIT_NAME"
          export GIT_AUTHOR_EMAIL="$GIT_EMAIL"
          export GIT_COMMITTER_NAME="$GIT_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_EMAIL"

          git add README.md assets/
          if git diff --staged --quiet; then
            echo "No changes in stats or cards to commit."
          else
            git commit -m "📊 auto(stats): synchronize live CP metrics and platform cards [skip ci]"
            git pull --rebase origin main || true
            git push origin main || git push https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
          fi
