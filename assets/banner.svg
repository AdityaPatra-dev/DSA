<svg width="100%" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Animated Neon Text Gradient -->
    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4">
        <animate attributeName="stop-color" values="#00f5d4; #7b2cbf; #f72585; #4cc9f0; #00f5d4" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7209b7">
        <animate attributeName="stop-color" values="#7209b7; #f72585; #4cc9f0; #00f5d4; #7209b7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#4cc9f0">
        <animate attributeName="stop-color" values="#4cc9f0; #00f5d4; #7b2cbf; #f72585; #4cc9f0" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7209b7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f72585" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7209b7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .badge-rect {
      transition: all 0.3s ease;
    }
    .glow-dot {
      animation: pulse 3s infinite ease-in-out;
    }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="240" rx="16" fill="url(#bgGrad)" />
  <rect width="1000" height="240" rx="16" fill="url(#ambientGlow)" />
  <rect width="996" height="236" x="2" y="2" rx="14" stroke="url(#borderGrad)" stroke-width="1.5" fill="none" opacity="0.7" />

  <!-- Subtle High-tech Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="240" />
    <line x1="250" y1="0" x2="250" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="550" y1="0" x2="550" y2="240" />
    <line x1="700" y1="0" x2="700" y2="240" />
    <line x1="850" y1="0" x2="850" y2="240" />
    <line x1="0" y1="60" x2="1000" y2="60" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="180" x2="1000" y2="180" />
  </g>

  <!-- Glowing Corner Ornaments -->
  <circle cx="20" cy="20" r="3" fill="#00f5d4" class="glow-dot" />
  <circle cx="980" cy="20" r="3" fill="#f72585" class="glow-dot" />
  <circle cx="20" cy="220" r="3" fill="#f72585" class="glow-dot" />
  <circle cx="980" cy="220" r="3" fill="#00f5d4" class="glow-dot" />

  <!-- Code brackets graphic left & right -->
  <text x="60" y="130" font-family="'Courier New', monospace" font-size="64" font-weight="900" fill="#00f5d4" opacity="0.2">&lt;/&gt;</text>
  <text x="860" y="130" font-family="'Courier New', monospace" font-size="64" font-weight="900" fill="#f72585" opacity="0.2">{ ; }</text>

  <!-- Tagline Top -->
  <text x="500" y="55" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#00f5d4" letter-spacing="4" text-anchor="middle">
    ✦ REPOSITORY OF ALGORITHMIC EXCELLENCE ✦
  </text>

  <!-- Main Hero Name -->
  <text x="500" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#neonText)" letter-spacing="2" text-anchor="middle">
    ADITYA PATRA
  </text>

  <!-- Subtitle -->
  <text x="500" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#c9d1d9" letter-spacing="1.5" text-anchor="middle">
    DATA STRUCTURES &amp; ALGORITHMS • COMPETITIVE PROGRAMMING
  </text>

  <!-- Platform Pills Container -->
  <g transform="translate(120, 175)">
    <!-- Pill 1: C++ -->
    <rect x="0" y="0" width="85" height="28" rx="14" fill="#00599c" opacity="0.25" stroke="#00599c" stroke-width="1" />
    <text x="42.5" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#61afef" text-anchor="middle">⚡ C++20</text>

    <!-- Pill 2: C -->
    <rect x="95" y="0" width="75" height="28" rx="14" fill="#a8b9cc" opacity="0.15" stroke="#a8b9cc" stroke-width="1" />
    <text x="132.5" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#abb2bf" text-anchor="middle">🔧 C11</text>

    <!-- Pill 3: LeetCode -->
    <rect x="180" y="0" width="110" height="28" rx="14" fill="#ffa116" opacity="0.15" stroke="#ffa116" stroke-width="1" />
    <text x="235" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffa116" text-anchor="middle">🔥 LEETCODE</text>

    <!-- Pill 4: Codeforces -->
    <rect x="300" y="0" width="125" height="28" rx="14" fill="#1f8acb" opacity="0.15" stroke="#1f8acb" stroke-width="1" />
    <text x="362.5" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4ba3e3" text-anchor="middle">🏆 CODEFORCES</text>

    <!-- Pill 5: CodeChef -->
    <rect x="435" y="0" width="115" height="28" rx="14" fill="#5b4638" opacity="0.2" stroke="#d4a373" stroke-width="1" />
    <text x="492.5" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#d4a373" text-anchor="middle">⭐ CODECHEF</text>

    <!-- Pill 6: HackerRank -->
    <rect x="560" y="0" width="120" height="28" rx="14" fill="#00ea64" opacity="0.15" stroke="#00ea64" stroke-width="1" />
    <text x="620" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#00ea64" text-anchor="middle">💻 HACKERRANK</text>

    <!-- Pill 7: HackerEarth -->
    <rect x="690" y="0" width="125" height="28" rx="14" fill="#323754" opacity="0.3" stroke="#8b949e" stroke-width="1" />
    <text x="752.5" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#9cdcfe" text-anchor="middle">🎯 HACKEREARTH</text>
  </g>
</svg>
